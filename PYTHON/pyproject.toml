[project]
name = "OrdenDelAuror"
version = "0.1.0"
description = "Cifrado con python"
requires-python = ">=3.12"
dependencies = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
