
name: Tests del Reto 2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar-configuracion:
    name: Validar configuración del repositorio
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar estructura inicial
        shell: bash
        run: |
          echo "Comprobando estructura del repositorio..."

          test -d .github/workflows
          test -f .pre-commit-config.yaml

          echo "La estructura inicial existe correctamente."

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pre-commit
        run: python -m pip install pre-commit

      - name: Validar archivos con pre-commit
        run: python -m pre_commit run --all-files
